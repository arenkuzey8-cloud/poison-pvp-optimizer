name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poison-pvp-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle --no-daemon clean build
      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: poison-pvp-optimizer/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: poison-pvp-optimizer-verified-build
          path: |
            poison-pvp-optimizer/build/libs/*.jar
            poison-pvp-optimizer/build/libs/SHA256SUMS.txt
          if-no-files-found: error
